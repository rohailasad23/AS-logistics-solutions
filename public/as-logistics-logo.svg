<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" role="img" aria-label="AS Logistics Solutions logo">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b74de" />
      <stop offset="100%" stop-color="#00c2a8" />
    </linearGradient>
    <style>
      .t{font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; font-weight:700; fill:#0f172a}
      .s{font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; font-weight:600; fill:#475569}
    </style>
  </defs>
  <rect width="64" height="64" rx="10" fill="url(#g)" />
  <text x="32" y="40" text-anchor="middle" font-size="28" font-family="Inter, Arial" font-weight="700" fill="#fff">AS</text>
  <g transform="translate(80,20)">
    <text class="t" x="0" y="4" font-size="18">AS Logistics</text>
    <text class="s" x="0" y="28" font-size="12">Solutions</text>
  </g>
</svg>